<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Laboratorio HMM</title>
<style>
/* ===== Layout concept: HUD control room — left sidebar nav tree (clase>tema>subtema, read-only progress) with right content column: tema intro + animation + sequential subtema stepper ending in a general quiz ===== */
:root{
  --bg:#030a0d; --bg-grid: rgba(90,226,255,.05);
  --panel: rgba(8,22,27,.74); --panel-solid:#071a20; --panel-raised:#0b222a;
  --border: rgba(86,221,255,.26); --border-strong: rgba(86,221,255,.55);
  --fg:#d9f6ff; --fg-muted:#80b7c6; --fg-dim:#4c7e8c;
  --accent:#27e4ff; --accent-soft:rgba(39,228,255,.14); --accent-ink:#00262b;
  --accent2:#ff9245; --accent2-soft:rgba(255,146,69,.16); --accent2-ink:#2b1200;
  --good:#39ffb4; --bad:#ff5d6c;
  --font-display:'Orbitron',var(--font-body);
  --font-body:'Rajdhani',Inter,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --glow: 0 0 14px rgba(39,228,255,.35);
  --gloss-bg:#1f1a14; --gloss-panel:#2a2319; --gloss-fg:#efe6d2; --gloss-fg-muted:#b9ab8c;
  --gloss-border:#52442c; --gloss-accent:#d8b43c; --gloss-shadow:0 14px 34px rgba(0,0,0,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef6f8; --bg-grid: rgba(0,120,150,.06);
    --panel: rgba(255,255,255,.82); --panel-solid:#ffffff; --panel-raised:#f1fafc;
    --border: rgba(0,139,170,.28); --border-strong: rgba(0,139,170,.55);
    --fg:#04262c; --fg-muted:#386f7c; --fg-dim:#6c99a3;
    --accent:#0089a6; --accent-soft:rgba(0,137,166,.12); --accent-ink:#eafcff;
    --accent2:#c9660a; --accent2-soft:rgba(201,102,10,.12); --accent2-ink:#fff4e9;
    --good:#0a9a66; --bad:#c4293a;
    --glow: 0 0 10px rgba(0,137,166,.22);
    --gloss-bg:#fbf6e8; --gloss-panel:#fffdf6; --gloss-fg:#2b2217; --gloss-fg-muted:#6b5c42;
    --gloss-border:#cdbd93; --gloss-accent:#8a6410; --gloss-shadow:0 14px 34px rgba(60,40,10,.18);
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#eef6f8; --bg-grid: rgba(0,120,150,.06);
  --panel: rgba(255,255,255,.82); --panel-solid:#ffffff; --panel-raised:#f1fafc;
  --border: rgba(0,139,170,.28); --border-strong: rgba(0,139,170,.55);
  --fg:#04262c; --fg-muted:#386f7c; --fg-dim:#6c99a3;
  --accent:#0089a6; --accent-soft:rgba(0,137,166,.12); --accent-ink:#eafcff;
  --accent2:#c9660a; --accent2-soft:rgba(201,102,10,.12); --accent2-ink:#fff4e9;
  --good:#0a9a66; --bad:#c4293a;
  --glow: 0 0 10px rgba(0,137,166,.22);
  --gloss-bg:#fbf6e8; --gloss-panel:#fffdf6; --gloss-fg:#2b2217; --gloss-fg-muted:#6b5c42;
  --gloss-border:#cdbd93; --gloss-accent:#8a6410; --gloss-shadow:0 14px 34px rgba(60,40,10,.18);
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--fg); font-family:var(--font-body); font-size:16px;
  background:
    radial-gradient(ellipse 900px 500px at 15% -8%, var(--accent-soft), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, var(--accent2-soft), transparent 55%),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 42px),
    var(--bg);
  font-variant-numeric: tabular-nums;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:.3px}
p{line-height:1.55}
.mono{font-family:var(--font-mono)}
a{color:var(--accent)}
button{font-family:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}

.btn{
  position:relative; border:1px solid var(--border-strong); background:var(--panel-raised); color:var(--fg);
  padding:10px 18px; font-size:13px; font-family:var(--font-display); letter-spacing:.6px; text-transform:uppercase;
  cursor:pointer; font-weight:500; display:inline-flex; align-items:center; gap:8px;
  clip-path: polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition: box-shadow .15s, color .15s, background .15s;
}
.btn:hover{box-shadow:var(--glow); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{box-shadow:0 0 18px rgba(39,228,255,.55); color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

.hpanel{position:relative;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:6px;padding:20px}
.hpanel::before,.hpanel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;opacity:.9}
.hpanel::before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.hpanel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border);position:relative;z-index:20}
.topbar .right-pad{padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border:1px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--accent);font-size:11px;flex:none;box-shadow:var(--glow);position:relative}
.brand-mark::before{content:"";position:absolute;inset:-5px;border:1px solid var(--border);border-radius:50%}
.brand-text h1{font-size:16px;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg)}
.brand-text .sub{font-size:10.5px;color:var(--fg-dim);display:flex;align-items:center;gap:6px;letter-spacing:.4px;margin-top:2px}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good)}
@media (prefers-reduced-motion:no-preference){.pulse-dot{animation:pulse 2.2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.hud-stat{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:6px;padding:6px 14px 6px 10px;background:var(--panel-raised)}
.hud-stat .lbl{font-size:9.5px;letter-spacing:1px;color:var(--fg-dim);text-transform:uppercase;font-family:var(--font-display)}
.hud-stat .val{font-family:var(--font-mono);font-size:15px;color:var(--accent);font-weight:700;text-shadow:0 0 8px rgba(39,228,255,.5)}
.iconbtn{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--panel-raised);color:var(--fg-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.hamburger{display:none}

.shell{display:flex;align-items:flex-start}
.sidebar{width:300px;flex:none;position:sticky;top:0;max-height:100dvh;overflow-y:auto;border-right:1px solid var(--border);background:var(--panel);backdrop-filter:blur(8px)}
.sidebar-inner{padding:16px 14px 40px max(14px,env(safe-area-inset-left,0px))}
.content-col{flex:1;min-width:0}
main{padding:26px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,16px); max-width:900px;margin:0 auto}

.scrim{position:fixed;inset:0;background:rgba(0,4,6,.6);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:5px;cursor:pointer;color:var(--fg-muted);font-size:13.5px;font-family:var(--font-display);letter-spacing:.3px;text-transform:uppercase}
.nav-item:hover{color:var(--fg);background:var(--panel-raised)}
.nav-item.active{color:var(--accent);background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.nav-sep{height:1px;background:var(--border);margin:14px 0}

.clase-group{margin-top:16px}
.clase-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.clase-head h3{font-size:11.5px;letter-spacing:1.8px;color:var(--accent2);text-transform:uppercase}
.clase-head .ring{width:26px;height:26px}

.tema-row{border-radius:6px;margin-bottom:3px}
.tema-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 6px;cursor:pointer;border-radius:6px}
.tema-head:hover{background:var(--panel-raised)}
.tema-head .chev{width:14px;color:var(--fg-dim);font-size:10px;flex:none;transition:transform .15s}
.tema-row.open .chev{transform:rotate(90deg)}
.tema-head .tlabel{flex:1;min-width:0;font-size:12.5px;color:var(--fg);line-height:1.3}
.tema-head .tlabel b{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-dim);font-weight:400;letter-spacing:.5px}
.tema-head.active .tlabel{color:var(--accent)}
.tema-head .ring{width:26px;height:26px;flex:none}

.sub-list{display:none;padding:2px 0 8px 30px;border-left:1px solid var(--border);margin-left:14px}
.tema-row.open .sub-list{display:block}
.sub-item{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:4px;cursor:pointer}
.sub-item:hover{background:var(--panel-raised)}
.sub-item.active{background:var(--accent-soft)}
.sub-item .sdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border);flex:none;margin-top:5px;background:transparent}
.sub-item .sdot.done{background:var(--good);border-color:var(--good);box-shadow:0 0 5px rgba(57,255,180,.6)}
.sub-item .slabel{font-size:11.5px;color:var(--fg-muted);line-height:1.4}
.sub-item.done .slabel{color:var(--fg-dim);text-decoration:line-through}
.sub-item .spage{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--fg-dim);margin-top:1px}

.ring text{font-family:var(--font-mono);fill:var(--fg);font-weight:700}
.ring .track{stroke:var(--border)}
.ring .fill{stroke:var(--accent);stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(39,228,255,.5))}

.hero{margin-bottom:22px}
.hero h2{font-size:24px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;color:var(--fg)}
.hero p{color:var(--fg-muted);max-width:62ch;font-size:14.5px}
.method{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.method span{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--fg-muted);display:flex;align-items:center;gap:7px;font-family:var(--font-mono)}
.method b{color:var(--accent)}

.clase-section{margin-top:26px}
.clase-section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.clase-section-head h3{font-size:13px;letter-spacing:2px;color:var(--accent2);text-transform:uppercase}
.clase-section-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;transition:.15s}
.tcard:hover{border-color:var(--accent);box-shadow:var(--glow)}
.tcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tcard .num{font-family:var(--font-mono);font-size:10.5px;color:var(--accent2);letter-spacing:.5px}
.tcard h3{font-size:14.5px;line-height:1.3;font-family:var(--font-body);font-weight:700;text-transform:none}
.tcard .meta{font-size:10.5px;color:var(--fg-dim);font-family:var(--font-mono)}

.crumb{display:flex;align-items:center;gap:8px;color:var(--fg-muted);font-size:12px;margin-bottom:16px;cursor:pointer;font-family:var(--font-mono)}
.crumb:hover{color:var(--accent)}
.topic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topic-head h2{font-size:21px;max-width:46ch;text-transform:uppercase;letter-spacing:.5px}
.chip-src{font-size:10.5px;font-family:var(--font-mono);border:1px solid var(--border);border-radius:5px;padding:5px 9px;color:var(--fg-muted);white-space:nowrap}

section.block{margin-bottom:16px}
section.block h4{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-family:var(--font-display)}
section.block h4 i{width:16px;height:16px;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;color:var(--fg-dim)}

blockquote{margin:0;padding-left:16px;border-left:2px solid var(--accent2);font-family:var(--font-mono);font-size:13px;line-height:1.75;color:var(--fg)}
.quote-src{display:block;margin-top:6px;font-size:10.5px;color:var(--fg-dim);font-family:var(--font-body)}

.theory-list{display:flex;flex-direction:column;gap:14px}
.theory-item{display:flex;gap:12px;align-items:flex-start}
.theory-item .theory-page{flex:none;margin-top:3px;font-family:var(--font-mono);font-size:10px;color:var(--accent2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;white-space:nowrap}
.theory-item blockquote{flex:1;font-size:12.5px;line-height:1.65}

.venn-card{margin:16px 0;padding:16px;background:var(--panel-raised);border:1px solid var(--border);border-radius:8px}
.venn-card svg.diagram{max-width:280px;margin:0 auto}
.venn-note{margin-top:10px;font-size:11.5px;color:var(--fg-dim);font-style:italic;line-height:1.5}

.concept p{font-size:14.5px;color:var(--fg)}
.example{background:var(--panel-raised);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.example p{font-size:14px;color:var(--fg);margin:0}
.example .label{font-size:10.5px;color:var(--accent2);font-weight:700;letter-spacing:.6px;margin-bottom:6px;display:block;font-family:var(--font-display);text-transform:uppercase}

.anim-shell{border:1px solid var(--border);border-radius:8px;background:var(--panel-raised);padding:14px;overflow:hidden}
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px}
.tl-step{flex:none;min-width:42px;text-align:center;border-radius:5px;border:1px solid var(--border);background:var(--panel-solid);padding:6px 4px;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);cursor:pointer}
.tl-step .sym{font-size:13px;color:var(--fg);display:block}
.tl-step.now{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--glow)}
.tl-step.now .sym{color:var(--accent)}
.tl-step.past{color:var(--fg-muted)}
svg.diagram{width:100%;height:auto;display:block;filter:drop-shadow(0 0 5px rgba(39,228,255,.18))}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.ctrl-row button{width:38px;height:34px;border-radius:5px;border:1px solid var(--border);background:var(--panel-solid);color:var(--fg);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.ctrl-row button:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--glow)}
.ctrl-row button:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.readout{margin-top:12px;background:var(--panel-solid);border:1px dashed var(--border);border-radius:6px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;color:var(--fg-muted);min-height:20px}
.readout b{color:var(--accent2)}
.anim-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.reveal-toggle{font-size:11px;display:flex;align-items:center;gap:6px;color:var(--fg-muted);cursor:pointer;user-select:none;font-family:var(--font-mono)}
.reveal-toggle input{accent-color:var(--accent)}

.qz-progress{display:flex;gap:4px;margin-bottom:16px}
.qz-progress i{height:3px;flex:1;border-radius:2px;background:var(--border)}
.qz-progress i.done{background:var(--good)}
.qz-progress i.bad{background:var(--bad)}
.qz-progress i.now{background:var(--accent2)}
.qz-head{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-muted);margin-bottom:10px;font-family:var(--font-mono)}
.qz-q{font-size:16px;margin-bottom:14px;font-weight:700;line-height:1.4;font-family:var(--font-body)}
.qz-opts{display:flex;flex-direction:column;gap:8px}
.qz-opt{text-align:left;border:1px solid var(--border);background:var(--panel-raised);color:var(--fg);padding:12px 14px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.qz-opt .letter{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);border:1px solid var(--border);border-radius:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.qz-opt:hover:not(:disabled){border-color:var(--accent)}
.qz-opt.correct{border-color:var(--good);background:color-mix(in srgb, var(--good) 14%, var(--panel-raised));box-shadow:0 0 12px rgba(57,255,180,.25)}
.qz-opt.correct .letter{background:var(--good);color:#00230f;border-color:var(--good)}
.qz-opt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, var(--panel-raised))}
.qz-opt.wrong .letter{background:var(--bad);color:#2a0905;border-color:var(--bad)}
.qz-opt:disabled{cursor:default}
.qz-explain{margin-top:14px;background:var(--panel-raised);border-left:2px solid var(--accent);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--fg-muted);display:none}
.qz-explain.show{display:block}
.qz-explain b{color:var(--fg)}
.qz-nav{display:flex;justify-content:flex-end;margin-top:16px}
.qz-result{text-align:center;padding:18px 0}
.qz-result .big{font-family:var(--font-mono);font-size:44px;color:var(--accent);font-weight:700;text-shadow:0 0 16px rgba(39,228,255,.4)}
.qz-result p{color:var(--fg-muted);font-size:13.5px}
.qz-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:16px;text-align:left}
.qz-breakdown div{background:var(--panel-raised);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-size:11.5px}
.qz-breakdown b{display:block;font-family:var(--font-mono);color:var(--accent2)}

.sub-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sub-panel-head .tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-dim)}
.sub-title{font-size:15px;margin-bottom:12px;color:var(--fg);font-weight:700}
.sub-note{margin:14px 0;font-size:13.5px;color:var(--fg-muted)}

footer.page{text-align:center;color:var(--fg-dim);font-size:11px;padding:30px 0 10px;font-family:var(--font-mono)}

/* ===== glosario académico (tooltip) + modal de corrección — deliberadamente NO estilo Jarvis ===== */
.kw{border-bottom:1.5px dotted var(--gloss-accent);cursor:help;border-radius:1px}
.kw:hover,.kw:focus{outline:none;background:color-mix(in srgb, var(--gloss-accent) 20%, transparent)}

.gloss-tip{
  position:fixed;z-index:85;max-width:300px;padding:12px 14px;border-radius:3px;
  font-family:var(--font-serif);font-size:13.5px;line-height:1.55;
  background:var(--gloss-panel);color:var(--gloss-fg);border:1px solid var(--gloss-border);
  box-shadow:var(--gloss-shadow);opacity:0;pointer-events:none;transform:translateY(4px);
  transition:opacity .12s,transform .12s;
}
.gloss-tip.show{opacity:1;transform:translateY(0)}
.gloss-tip .gt-label{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gloss-fg-muted);margin-bottom:5px}

    {label:"Modelo completo (inicial + transición + emisión)", page:"p.20",
     quote:`El modelo completo sería: Probabilidades iniciales p(C)=p(N)=1/2, más la matriz de transición (0,95 / 0,05) y la matriz de emisión: P{1|N}=1/6... P{6|C}=1/2.`,
     explain:`Un HMM completo junta tres piezas: probabilidades iniciales, matriz de transición entre estados, y matriz de emisión de símbolos por estado.`,

    {label:"Cálculo de la probabilidad de la secuencia ejemplo", page:"p.21–22",
     quote:`P{secuencia ejemplo} = 0,5·1/2·0,95·1/10·0,95·1/10·0,05·1/6·0,95·1/6·0,05·1/2·0,05·1/6·0,95·1/6 ≈ 9,82×10⁻¹¹.`,

    {label:"Visualización como caminos (path)", page:"p.23",

     explain:`El mismo cálculo se puede dibujar como un "camino" que acumula probabilidad de transición y de emisión en cada paso — la idea base de Avance y Viterbi.`,

    {label:'Comparación con el caso "siempre dado cargado"', page:"p.24",

    {label:"Definición formal del HMM, tupla M=(A,S,p,E,T)", page:"p.25",

{
  id:"forward", num:"04", short:"Alg. de Avance", clase:"c9",
  title:"Algoritmo de Avance (Forward Algorithm)",
  src:"Clase 9 — filminas 26 a 32",
  concept:`El Algoritmo de Avance responde: "¿qué tan probable es esta secuencia de observaciones, sumando todos los caminos de estados ocultos que podrían haberla generado?". En vez de sumar cada camino por separado, construye la respuesta paso a paso guardando resultados parciales (programación dinámica).`,
  example:`Un detective que no vio al sospechoso, pero tiene pruebas. En vez de apostar a una sola hipótesis, suma la probabilidad de TODAS las secuencias de eventos posibles que explican esas pruebas, acumulando la evidencia paso a paso en vez de recalcular todo desde cero.`,
  hasAnim:null,
  subtemas:[
    {label:"P{O,π|M} vs. P{O}", page:"p.26",
     quote:`Para una secuencia observada O y un camino de estados π, la probabilidad conjunta se denota P{O,π|M}. Esto es lo que hemos calculado hasta ahora. En general, no tendremos el camino de estados, entonces la probabilidad de interés será P{O|M} (la denotaremos P{O}).`,
     explain:`Hasta ahora calculamos la probabilidad de UN camino específico; lo que interesa es la probabilidad de la secuencia sola, sumando sobre todos los caminos posibles.`,
     q:{q:"¿Qué diferencia hay entre P{O,π|M} y P{O|M}?",
        o:["Son exactamente lo mismo","P{O,π|M} es la probabilidad de un camino específico; P{O|M} suma sobre todos los caminos posibles","P{O|M} solo aplica al modelo multinomial","P{O,π|M} no depende del modelo M"], c:1, e:"P{O,π|M} es para un camino π dado; P{O} se calcula sumando todos los posibles caminos."}},
    {label:"Definición general (programación dinámica)", page:"p.27",
     quote:`Se utiliza programación dinámica, y se calcula la probabilidad de observar una secuencia o1,o2,...,ot y se alcanza un estado Si y una posición t para un modelo dado M: αt(k) = P{O=o1,...,ot, π=Si}.`,
     explain:`αt(k) guarda, paso a paso, la probabilidad acumulada de haber visto la secuencia hasta el paso t terminando en el estado k.`,
     q:{q:"¿Qué representa αt(k) en el Algoritmo de Avance?",
        o:["La probabilidad de todo el camino más probable","La probabilidad acumulada de observar o1...ot terminando en el estado k","La probabilidad de transición entre dos estados cualquiera","El número total de estados del modelo"], c:1, e:"αt(k)=P{O=o1,...,ot, π=Si}: probabilidad acumulada hasta el paso t, terminando en el estado k."}},
    {label:"Definición del algoritmo: inicio, iteración, fin", page:"p.28",
     quote:`Inicio: α1(i) = p(i) × ei(o1). Iteración: αt+1(i) = Σj αt(i) × Ti,j × ei(ot+1). Finalizo: P{O} = Σi αT(i).`,
     explain:`Las tres fórmulas que arman el algoritmo completo: cómo arranca, cómo se repite y cómo se obtiene el resultado final.`,
     q:{q:"¿Cómo se calcula la iteración del algoritmo de avance?",
        o:["αt+1(i) = Σj αt(i)×Ti,j×ei(ot+1)","αt+1(i) = max_j[αt(i)×Ti,j]","αt+1(i) = αt(i) / Ti,j","αt+1(i) = p(i)×ei(o1)"], c:0, e:"Es la fórmula de iteración textual de la filmina."}},
    {label:"Ejemplo gráfico del algoritmo", page:"p.29",
     quote:`Diagrama: α1(2) ×0,95×1/6→ α2(2); α1(1) ×0,95×1/10→ α2(1); con cruces ×0,05×1/6 y ×0,05×1/10, desde el estado inicial P con 0,5×1/6 y 0,5×1/2.`,
     explain:`El diagrama muestra cómo cada αt(i) se arma sumando las contribuciones que llegan desde todos los estados del paso anterior.`,
     q:{q:"En el diagrama, ¿de dónde se arma el valor de α2(i) en un estado i?",
        o:["Solo del valor de α1 en el mismo estado i","De la suma de las contribuciones de TODOS los estados en el paso anterior, multiplicadas por transición y emisión","De un cálculo aleatorio","Del valor final P{O} directamente"], c:1, e:"El diagrama muestra flechas desde ambos estados del paso anterior confluyendo en cada estado del paso siguiente: se suman las contribuciones."}},
    {label:"Ejemplo numérico resuelto", page:"p.30",
     quote:`α1(2)=0,08333 y α1(1)=0,25. α2(2)=(α1(2)·0,95+α1(1)·0,05)·1/6. α2(1)=(α1(2)·0,05+α1(1)·0,95)·1/10. P{O}=α2(2)+α2(1)=0,039444.`,
     explain:`Con números concretos (secuencia "6,1"), se ve cómo se combinan los α de cada estado hasta llegar a P{O}.`,
     q:{q:'En el ejemplo numérico resuelto (secuencia "6,1"), ¿cuánto dio P{O}?',
        o:["0,039444","9,82×10⁻¹¹","0,5","1"], c:0, e:"P{O}=α2(2)+α2(1)=0,039444, según el cálculo de la filmina."}},
    {label:"Complejidad computacional (N^T vs. O(N²T))", page:"p.31",
     quote:`Si se tienen N estados ocultos y una secuencia observada de T símbolos, fuerza bruta necesita NT operaciones. En el caso del algoritmo hacia adelante, O(N²T). Debo guardar: todos los αt(i) del paso anterior, los Tij del estado previo, y ei(ot+1).`,
     explain:`El Algoritmo de Avance es muchísimo más eficiente que probar todos los caminos (fuerza bruta): de exponencial a polinomial.`,
     q:{q:"¿Qué información hay que guardar en cada paso del algoritmo de avance?",
        o:["Todos los αt(i) del paso anterior, los Tij del estado previo y ei(ot+1)","Solo el resultado final P{O}","Todos los caminos posibles explícitamente","Nada, no hace falta guardar nada"], c:0, e:"La filmina lista exactamente eso: los αt(i) anteriores, los Tij y ei(ot+1)."}},
    {label:"Referencias", page:"p.32",
     quote:`1. Y. Bengio, I. J. Goodfellow, A. Courville, "Deep Learning", (2015). 2. M. Rocha and P. G. Ferreira, "Bioinformatics Algorithms. Design and Implementation in Python", Academic Press, Elsevier (2018).`,
     explain:`Las dos referencias bibliográficas de la clase: el libro de Deep Learning y el libro de algoritmos de bioinformática en Python.`,
     q:{q:"¿Cuál de estos libros es citado como referencia en Clase 9?",
        o:["'Deep Learning' de Bengio, Goodfellow y Courville","'Molecular Biology of the Cell'","'Introduction to Algorithms' de Cormen","'Pattern Recognition and Machine Learning' de Bishop"], c:0, e:"Es una de las dos referencias citadas textualmente en la filmina 32."}},
  ],
  questions:[
    {q:"¿Qué calcula el Algoritmo de Avance?",
     o:["El camino de estados más probable","La probabilidad total de una secuencia observada, sumando todos los caminos posibles","Las probabilidades de transición óptimas","El número de estados ocultos del modelo"],
     c:1, e:'"Esta puede ser calculada sumando todos los posibles caminos. Se puede calcular con el Algoritmo de Avance."'},
    {q:"¿Cómo se define el paso de inicio del algoritmo?",
     o:["α1(i) = p(i) × ei(o1)","α1(i) = Ti,j","α1(i) = max_j[Tj,i]","α1(i) = Σ ei(oi)"],
     c:0, e:"Es la fórmula textual de inicio dada en la filmina."},
    {q:"¿Qué técnica permite calcularlo de forma eficiente en vez de fuerza bruta?",
     o:["Recursión sin memoria","Programación dinámica","Búsqueda binaria","Backpropagation"],
     c:1, e:'"Se utiliza programación dinámica" tanto en Avance como en Viterbi.'},
    {q:"Con N estados ocultos y T símbolos, ¿cuál es la complejidad del algoritmo de avance frente a fuerza bruta?",
     o:["O(N^T), igual que fuerza bruta","O(N²T), mucho más eficiente que N^T","O(T), sin importar N","O(N), sin importar T"],
     c:1, e:"La filmina lo indica explícitamente: fuerza bruta necesita N^T operaciones; el algoritmo de avance, O(N²T)."},
  ]
},

{
  id:"dnahmm", num:"06", short:"HMM del ADN", clase:"c10",
  title:"Un modelo del ADN con HMM",
  src:"Clase 10 — filminas 10 a 13",
  concept:`Un genoma no es una secuencia uniforme: tiene regiones con funciones distintas (promotores, exones, intrones, islas CpG, etc.). Un HMM puede modelar cada región como un estado oculto, cada uno con su propia composición de bases y sus propias reglas de qué región suele seguir a cuál. Según qué se quiera detectar, la topología del HMM cambia.`,
  example:`Leer un libro sin que te digan los títulos de las secciones, e igual identificar qué parte es "índice", qué parte es "capítulo" y qué parte es "nota al pie" solo por el patrón del texto. El HMM del ADN hace algo parecido: reconoce si un tramo de secuencia "suena" a promotor, a exón o a región intergénica, solo por el patrón de letras A, C, G, T.`,
  hasAnim:null,
  subtemas:[
    {label:"Sectores de la secuencia (intergenic, CpG island, promoter, exón, intrón)", page:"p.10",
     quote:`Cada sector de la secuencia tiene una función, la idea sería reconocer cada uno de esos sectores: Intergenic, CpG island, Promoter, First exon, Intron, Other exon, Intron...`,
     explain:`El genoma se puede pensar como una sucesión de "sectores funcionales" distintos, cada uno un estado oculto posible.`,
     q:{q:'Según el esquema de la filmina, ¿qué sector aparece justo antes del "First exon"?',
        o:["Promoter","Other exon","Intron","Intergenic"], c:0, e:"El esquema muestra: Intergenic → CpG island → Promoter → First exon → Intron → Other exon → Intron."}},
    {label:"Definiciones: intrón, exón, región intergénica", page:"p.11",
     quote:`Intrón: Secuencia no codificante dentro de un gen que se elimina durante el proceso de splicing del ARN. Exón: Porción del gen que se conserva en el ARNm maduro tras el splicing. Región intergénica: Segmento de ADN ubicado entre dos genes.`,
     explain:`Tres piezas básicas del genoma: lo que se recorta (intrón), lo que queda (exón), y lo que está fuera de los genes (región intergénica).`,
     q:{q:"¿Qué tienen en común el intrón y la región intergénica, según sus definiciones?",
        o:["Ambos codifican proteínas","Ninguno de los dos aparece en el ARNm maduro tal cual (uno se elimina en el splicing, el otro está fuera de los genes)","Ambos son parte del ARNm maduro","Son sinónimos exactos"], c:1, e:"El intrón se elimina durante el splicing; la región intergénica ni siquiera forma parte de un gen."}},
    {label:"Definiciones: isla CpG, promotor, represor", page:"p.12",
     quote:`Isla CpG: Región de ADN con alta frecuencia de dinucleótidos CpG y alto contenido de GC. Promotor: Secuencia reguladora situada cerca del extremo 5' del gen, donde se une la ARN polimerasa. Represor: Proteína reguladora que disminuye o bloquea la transcripción al unirse a secuencias específicas del ADN.`,
     explain:`Tres elementos reguladores: una región rica en GC (isla CpG), el punto de arranque de la transcripción (promotor), y una proteína que la frena (represor).`,
     q:{q:"¿Qué hace un represor, según la filmina?",
        o:["Inicia la transcripción uniéndose a la ARN polimerasa","Disminuye o bloquea la transcripción uniéndose a secuencias específicas del ADN","Elimina intrones durante el splicing","Aumenta la frecuencia de dinucleótidos CpG"], c:1, e:"'Represor: Proteína reguladora que disminuye o bloquea la transcripción al unirse a secuencias específicas del ADN.'"}},
    {label:"Varios enfoques/topologías según la aplicación (tabla)", page:"p.13",
     quote:`Dependiendo de qué se busca, utilizaremos diferentes modelos: detección de regiones ricas en GC (2 estados), detección de exones de codificación (2 estados), detección de estructuras secundarias (~20 estados), detección de estados de cromatina (40 estados, diferentes combinaciones de marcas de cromatina).`,
     explain:`No hay un único HMM para el ADN: la cantidad de estados y qué emiten cambia según qué se quiera detectar.`,
     q:{q:"Según la tabla de la filmina, ¿cuántos estados ocultos se usan típicamente para detectar estados de cromatina?",
        o:["2 estados","20 estados","40 estados","Depende únicamente del alfabeto de observación"], c:2, e:"La tabla indica '40 estados, diferentes combinaciones de marcas de cromatina' para esa aplicación."}},
  ],
  questions:[
    {q:"Según la filmina, ¿qué es un intrón?",
     o:["Porción del gen que se conserva en el ARNm maduro","Secuencia no codificante que se elimina durante el splicing del ARN","Región reguladora cerca del extremo 5' del gen","Segmento de ADN entre dos genes"],
     c:1, e:"Definición textual de intrón en la filmina 11."},
    {q:"¿Qué caracteriza a una isla CpG?",
     o:["Baja frecuencia de dinucleótidos CpG","Alta frecuencia de dinucleótidos CpG y alto contenido de GC","Solo aparece dentro de intrones","Es sinónimo de represor"],
     c:1, e:"Definición textual en la filmina 12."},
    {q:"¿Cuál es la función de un promotor?",
     o:["Bloquear la transcripción uniéndose al ADN","Secuencia reguladora donde se une la ARN polimerasa para iniciar la transcripción","Eliminarse durante el splicing","Codificar proteínas directamente"],
     c:1, e:"Definición textual de promotor en la filmina 12."},
    {q:"¿Por qué se modela el ADN con un HMM en vez de un modelo simple?",

/* ---------------- storage ---------------- */
const STORE_KEY = "hmmlab_progress_v3";
function loadStore(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {topics:{}, subtemas:{}, exam:{best:0,total:0,attempts:0}};
}
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
let STORE = loadStore();
if(!STORE.subtemas) STORE.subtemas = {};

function recordTopicResult(topicId, score, total){
  const t = STORE.topics[topicId] || {best:0,total:total,attempts:0};
  t.best = Math.max(t.best, score); t.total = total; t.attempts = (t.attempts||0)+1;
  STORE.topics[topicId] = t; saveStore(STORE);
  renderScoreGlobal(); renderSidebar();
}
function recordExamResult(score, total){
  const e = STORE.exam || {best:0,total:0,attempts:0};
  e.best = Math.max(e.best, score); e.total = total; e.attempts = (e.attempts||0)+1;
  STORE.exam = e; saveStore(STORE); renderScoreGlobal();
}
function setSubtema(temaId, idx, val){
  const arr = STORE.subtemas[temaId] || [];
  arr[idx] = val;
  STORE.subtemas[temaId] = arr;
  saveStore(STORE);
  renderScoreGlobal(); renderSidebar();
}
function subtemaPct(tema){
  const arr = STORE.subtemas[tema.id] || [];
  const n = tema.subtemas.length; if(!n) return 0;
  const done = arr.filter(Boolean).length;
  return Math.round(100*done/n);
}
function quizPct(tema){
  const r = STORE.topics[tema.id];
  if(!r) return 0;
  return Math.round(100*Math.min(r.best,tema.questions.length)/tema.questions.length);
}
function temaPct(tema){ return Math.round((subtemaPct(tema)+quizPct(tema))/2); }
function clasePct(claseId){
  const temas = TOPICS.filter(t=>t.clase===claseId);
  if(!temas.length) return 0;
  return Math.round(temas.reduce((a,t)=>a+temaPct(t),0)/temas.length);
}
function globalMastery(){
  if(!TOPICS.length) return 0;
  return Math.round(TOPICS.reduce((a,t)=>a+temaPct(t),0)/TOPICS.length);
}
function renderScoreGlobal(){
  document.getElementById("scoreGlobal").textContent = globalMastery()+"%";
}

/* diagrama de conjuntos anidados (A ⊃ B ⊃ C) para relaciones de subconjunto reales entre conceptos */
function nestedCirclesSVG(levels){
  const size = 300, cx = size/2, cy = size/2;
  const n = levels.length;
  const radii = n===3? [128,90,50] : n===2? [120,65] : levels.map((_,i)=> 128 - i*(128/n));
  const colors = ["var(--accent2)","var(--accent)","var(--good)","var(--bad)"];
  let shapes = "";
  levels.forEach((lv,i)=>{
    const r = radii[i];
    const col = colors[i % colors.length];
    shapes += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    const isInnermost = i===n-1;
    const ly = isInnermost? cy : (cy - r + 22);
    const sy = ly + 15;
    shapes += `<text x="${cx}" y="${ly}" text-anchor="middle" fill="${col}" style="font-family:var(--font-display);font-size:${i===0?12.5:12}px;font-weight:700">${lv.label}</text>`;
    if(lv.sub) shapes += `<text x="${cx}" y="${sy}" text-anchor="middle" fill="var(--fg-dim)" style="font-family:var(--font-mono);font-size:9.5px">${lv.sub}</text>`;
  });
  return `<svg class="diagram" viewBox="0 0 ${size} ${size}">${shapes}</svg>`;
}

function ring(pct,size){
  size = size||26; const sw=Math.max(3,Math.round(size*0.13)); const r=(size-sw)/2;
  const c=2*Math.PI*r; const off=c*(1-Math.min(100,Math.max(0,pct))/100);
  const fs = Math.round(size*0.28);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"/>
    <circle class="fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${sw}"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" style="font-size:${fs}px">${pct}</text>
  </svg>`;
}

/* ---------------- glosario académico (tooltip) + modal de corrección ---------------- */
const GLOSS_KEYS = Object.keys(GLOSSARY).sort((a,b)=> b.length-a.length);
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
const GLOSS_RE = new RegExp(
  '(?<![A-Za-zÁÉÍÓÚÑÜáéíóúñü0-9])(' + GLOSS_KEYS.map(escapeRe).join('|') + ')(?![A-Za-zÁÉÍÓÚÑÜáéíóúñü0-9])',
  'gi'
);
function mark(text){
  if(text==null) return text;
  return String(text).replace(GLOSS_RE, (m)=> `<span class="kw" tabindex="0" data-kw="${m.toLowerCase()}">${m}</span>`);
}

const glossTip = document.getElementById("glossTip");
let glossPinned = false;
function showGloss(el){
  const def = GLOSSARY[el.dataset.kw];
  if(!def) return;
  glossTip.innerHTML = `<span class="gt-label">Glosario</span><span class="gt-term">${el.textContent}</span>${def}`;
  glossTip.classList.add("show");
  glossTip.style.left = "-9999px"; glossTip.style.top = "-9999px";
  const r = el.getBoundingClientRect();
  const tw = glossTip.offsetWidth, th = glossTip.offsetHeight;
  let left = r.left + r.width/2 - tw/2;
  left = Math.max(10, Math.min(left, window.innerWidth - tw - 10));
  let top = r.top - th - 10;
  if(top < 10) top = r.bottom + 10;
  glossTip.style.left = left+"px"; glossTip.style.top = top+"px";
}
function hideGloss(){ glossTip.classList.remove("show"); glossPinned = false; }
document.addEventListener("mouseover", (e)=>{ const kw=e.target.closest(".kw"); if(kw) showGloss(kw); });
document.addEventListener("mouseout", (e)=>{ const kw=e.target.closest(".kw"); if(kw && !glossPinned) hideGloss(); });
document.addEventListener("focusin", (e)=>{ const kw=e.target.closest(".kw"); if(kw) showGloss(kw); });
document.addEventListener("focusout", (e)=>{ const kw=e.target.closest(".kw"); if(kw && !glossPinned) hideGloss(); });
document.addEventListener("click", (e)=>{
  const kw = e.target.closest(".kw");
  if(kw){ glossPinned = true; showGloss(kw); return; }
  if(!e.target.closest(".gloss-tip")) hideGloss();
});
window.addEventListener("scroll", hideGloss, true);
window.addEventListener("resize", hideGloss);

const app = document.getElementById("app");
let currentView = "inicio";
let currentSubIdx = -1;

function go(view){
  closeSidebarMobile();
  view = view || "inicio";
  if(view==="inicio"){ currentView="inicio"; currentSubIdx=-1; renderInicio(); renderSidebar(); return; }
  if(view==="examen"){ currentView="examen"; currentSubIdx=-1; renderExamen(); renderSidebar(); return; }
  const m = view.match(/^(.+)-s(\d+)$/);
  if(m){
    const topic = TOPICS.find(t=>t.id===m[1]);
    if(topic){ currentView=topic.id; expandedTema=topic.id; renderTopic(topic, parseInt(m[2],10)-1); renderSidebar(); return; }
  }
  const topic = TOPICS.find(t=>t.id===view);
  if(topic){ currentView=topic.id; expandedTema=topic.id; renderTopic(topic); renderSidebar(); return; }
  currentView="inicio"; currentSubIdx=-1; renderInicio(); renderSidebar();
}
window.addEventListener("hashchange", ()=> go(location.hash.replace("#","")) );

  });
  html += `<div class="nav-sep"></div><div class="nav-item ${currentView==='examen'?'active':''}" data-go="examen">◆ Examen general</div>`;
  host.innerHTML = html;

  host.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.go;
      if(TOPICS.find(t=>t.id===id)) expandedTema = id;

    ch.addEventListener("click",(ev)=>{
      ev.stopPropagation();
      const row = ch.closest(".tema-row");
      const id = row.dataset.tema;
      expandedTema = (expandedTema===id)? null : id;
      renderSidebar();
    });
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* ---------------- sequential tema flow: subtema by subtema -> general quiz -> next tema ---------------- */
function mountTemaFlow(host, topic, forcedStep){
  const N = topic.subtemas.length;
  let step;
  if(typeof forcedStep === "number"){
    step = Math.max(0, Math.min(N, forcedStep));
  } else {
    const arr = STORE.subtemas[topic.id] || [];
    step = 0; while(step<N && arr[step]) step++;
  }

  render();

  function dots(){
    const arr = STORE.subtemas[topic.id]||[];
    let html = '<div class="qz-progress">';
    for(let k=0;k<N;k++){
      html += `<i class="${arr[k]?'done':(k===step?'now':'')}"></i>`;
    }
    html += `<i style="flex:1.6" class="${step>=N?'now':''}"></i>`;
    html += '</div>';
    return html;
  }

  function render(){
    currentSubIdx = (step<N)? step : -1;
    if(step<N) renderSubtema(step); else renderGeneralQuiz();
    renderSidebar();
  }

  function renderSubtema(i){
    const s = topic.subtemas[i];
    const arr = STORE.subtemas[topic.id]||[];
    const alreadyDone = !!arr[i];
    host.innerHTML = `
      ${dots()}
      <div class="sub-panel-head"><span class="tag">SUBTEMA ${i+1} / ${N}</span><span class="tag">${s.page}</span></div>
      <div class="sub-title">${s.label}</div>
      <blockquote>"${mark(s.quote)}"<span class="quote-src">— ${topic.src.split("—")[0].trim()}, ${s.page}</span></blockquote>
      ${s.diagram? `<div class="venn-card">${nestedCirclesSVG(s.diagram)}${s.diagramNote?`<p class="venn-note">${mark(s.diagramNote)}</p>`:""}</div>` : ""}
      <p class="sub-note">${mark(s.explain)}</p>
      <div class="qz-q" style="font-size:14.5px">${mark(s.q.q)}</div>
      <div class="qz-opts" id="subOpts">
        ${s.q.o.map((opt,k)=>`<button class="qz-opt" data-k="${k}"><span class="letter">${"ABCD"[k]}</span><span>${opt}</span></button>`).join("")}
      </div>
      <div class="qz-explain ${alreadyDone?'show':''}" id="subExp"><b>Por qué:</b> ${mark(s.q.e)}</div>
      <div class="qz-nav" style="justify-content:space-between">
        <button class="btn ghost" id="subPrev" ${i===0?'disabled':''}>← Anterior</button>
        <button class="btn primary" id="subNext" ${alreadyDone?'':'disabled'}>${i===N-1?'Ir al quiz general →':'Siguiente subtema →'}</button>
      </div>
    `;
    let locked = alreadyDone;
    if(alreadyDone){
      host.querySelectorAll(".qz-opt").forEach((b,k)=>{ b.disabled=true; if(k===s.q.c) b.classList.add("correct"); });
    }
    host.querySelectorAll(".qz-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(locked) return; locked=true;
        const k=+btn.dataset.k;
        host.querySelectorAll(".qz-opt").forEach((b2,k2)=>{
          b2.disabled=true;
          if(k2===s.q.c) b2.classList.add("correct");
          else if(k2===k) b2.classList.add("wrong");
        });
        document.getElementById("subExp").classList.add("show");
        document.getElementById("subNext").disabled=false;
        setSubtema(topic.id, i, true);
        if(k!==s.q.c) showAnswerModal(s.q.q, s.q.o[s.q.c], s.q.e);
      });
    });
    document.getElementById("subPrev").addEventListener("click", ()=>{ step=Math.max(0,step-1); render(); });
    document.getElementById("subNext").addEventListener("click", ()=>{ step=Math.min(N,step+1); render(); });
  }

  function renderGeneralQuiz(){
    host.innerHTML = `
      ${dots()}
      <div class="qz-head"><span>Quiz general del tema</span><span>${topic.questions.length} preguntas</span></div>
      <div id="genQuizHost"></div>
      <div class="qz-nav" style="justify-content:flex-start;margin-top:4px">
        <button class="btn ghost" id="subBack">← Volver a los subtemas</button>
      </div>
      <div id="nextCta"></div>
    `;
    document.getElementById("subBack").addEventListener("click", ()=>{ step=N-1; render(); });
    mountQuiz(document.getElementById("genQuizHost"), topic.questions, (score,total)=>{
      recordTopicResult(topic.id, score, total);
      renderNextCTA(score,total);
    });
  }

  function renderNextCTA(score,total){
    const idx = TOPICS.indexOf(topic);
    const next = TOPICS[idx+1];
    const box = document.getElementById("nextCta");
    if(!box) return;
    if(next){
      box.innerHTML = `<div class="cta-row" style="justify-content:center"><button class="btn primary" id="toNextTema">Siguiente: Tema ${next.num} · ${next.short} →</button></div>`;
      document.getElementById("toNextTema").addEventListener("click", ()=> location.hash = next.id);
    } else {
      box.innerHTML = `<div class="cta-row" style="justify-content:center"><button class="btn primary" id="toExam">¡Llegaste al final de la Unidad! → Examen general</button></div>`;
      document.getElementById("toExam").addEventListener("click", ()=> location.hash = "examen");
    }
  }
}

/* ---------------- quiz engine (used for general + exam) ---------------- */
function mountQuiz(host, questions, onFinish, withTopicBreakdown){
  let i=0, score=0, locked=false;
  const results = [];
  render();

  function render(){
    if(i>=questions.length) return renderResult();
    const q = questions[i];
    host.innerHTML = `
      <div class="qz-progress">${questions.map((_,k)=>`<i class="${k<i? (results[k]?'done':'bad') : (k===i?'now':'')}"></i>`).join("")}</div>
      <div class="qz-head"><span>Pregunta ${i+1} / ${questions.length}</span><span>Puntaje: ${score}</span></div>
      <div class="qz-q">${mark(q.q)}</div>
      <div class="qz-opts">
        ${q.o.map((opt,k)=>`<button class="qz-opt" data-k="${k}"><span class="letter">${"ABCD"[k]}</span><span>${opt}</span></button>`).join("")}
      </div>
      <div class="qz-explain" id="qexp"><b>Por qué:</b> ${mark(q.e)}</div>
      <div class="qz-nav"><button class="btn primary" id="qnext" disabled>${i===questions.length-1?"Ver resultado":"Siguiente"}</button></div>
    `;
    locked=false;
    host.querySelectorAll(".qz-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(locked) return; locked=true;
        const k = +btn.dataset.k;
        const correct = k===q.c;
        results[i]=correct;
        if(correct) score++;
        host.querySelectorAll(".qz-opt").forEach((b2,k2)=>{
          b2.disabled = true;
          if(k2===q.c) b2.classList.add("correct");
          else if(k2===k) b2.classList.add("wrong");
        });
        document.getElementById("qexp").classList.add("show");
        document.getElementById("qnext").disabled = false;
        if(!correct) showAnswerModal(q.q, q.o[q.c], q.e);
      });
    });
    document.getElementById("qnext").addEventListener("click", ()=>{ i++; render(); });
  }

  function renderResult(){
    const pct = Math.round(100*score/questions.length);
    let breakdown = "";
    if(withTopicBreakdown){
      const byTopic = {};
      questions.forEach((q,k)=>{ byTopic[q.topic]=byTopic[q.topic]||{ok:0,n:0}; byTopic[q.topic].n++; if(results[k]) byTopic[q.topic].ok++; });
      breakdown = `<div class="qz-breakdown">${Object.entries(byTopic).map(([name,v])=>`<div><b>${v.ok}/${v.n}</b>${name}</div>`).join("")}</div>`;
    }
    host.innerHTML = `
      <div class="qz-result">
        <div class="big">${score}/${questions.length}</div>
        <p>${pct}% de aciertos${pct>=80?" — ¡dominás el tema!":pct>=50?" — vas bien, repasá lo que falló.":" — convendría repasar los subtemas de nuevo."}</p>
        ${breakdown}
        <div class="cta-row" style="justify-content:center">
          <button class="btn primary" id="retry">Reintentar</button>
          <button class="btn ghost" id="toHome">Ir al inicio</button>
        </div>
      </div>
    `;
    onFinish(score, questions.length);
    document.getElementById("retry").addEventListener("click", ()=>{ i=0; score=0; results.length=0; render(); });
    document.getElementById("toHome").addEventListener("click", ()=> location.hash="inicio");
  }
}

/* ---------------- HMM dice automaton ---------------- */
function mountHmmAnim(host){
  const states = ["N","C"];
  const trans = {N:{N:0.95,C:0.05}, C:{N:0.05,C:0.95}};
  const emit = {
    N:{1:1/6,2:1/6,3:1/6,4:1/6,5:1/6,6:1/6},
    C:{1:0.1,2:0.1,3:0.1,4:0.1,5:0.1,6:0.5}
  };
  const N_STEPS = 10;

  function weightedPick(dist){
    const r = Math.random(); let acc=0;
    for(const k in dist){ acc+=dist[k]; if(r<=acc) return k; }
    return Object.keys(dist)[0];
  }
  function genSequence(){
    const states_seq=[]; const obs_seq=[];
    let s = Math.random()<0.5? "N":"C";
    for(let t=0;t<N_STEPS;t++){
      if(t>0) s = weightedPick(trans[s]);
      states_seq.push(s);
      obs_seq.push(+weightedPick(emit[s]));
    }
    return {states_seq, obs_seq};
  }

  let data = genSequence();
  let step = 0;
  let reveal = false;

  host.innerHTML = `
    <div class="timeline" id="hmmTl"></div>
    <svg class="diagram" id="hmmSvg" viewBox="0 0 360 200" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="readout" id="hmmReadout">Presioná ▶ para tirar el primer dado.</div>
    <div class="anim-foot">
      <label class="reveal-toggle"><input type="checkbox" id="hmmReveal"> Revelar estados ocultos (N / C)</label>
      <div class="ctrl-row" style="margin:0">
        <button id="hmmStart" title="Ir al inicio">|&#9664;</button>
        <button id="hmmPrev" title="Paso anterior">&#9664;</button>
        <button id="hmmNext" title="Paso siguiente">&#9654;</button>
        <button id="hmmEnd" title="Ir al final">&#9654;|</button>
      </div>
    </div>
  `;

  const svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){ const e=document.createElementNS(svgNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

  function drawBase(){
    const svg = document.getElementById("hmmSvg");
    svg.innerHTML="";
    svg.appendChild(el("path",{d:"M100,40 C80,10 60,10 60,40 C60,65 85,65 100,55", fill:"none", stroke:"var(--border)", "stroke-width":2}));
    svg.appendChild(el("path",{d:"M260,40 C280,10 300,10 300,40 C300,65 275,65 260,55", fill:"none", stroke:"var(--border)", "stroke-width":2}));
    svg.appendChild(textEl(80,18,"0.95","var(--fg-dim)",10));
    svg.appendChild(textEl(280,18,"0.95","var(--fg-dim)",10));
    svg.appendChild(el("path",{id:"edgeNC", d:"M110,70 C170,95 190,95 250,70", fill:"none", stroke:"var(--border)", "stroke-width":2, "marker-end":"url(#arrow)"}));
    svg.appendChild(el("path",{id:"edgeCN", d:"M250,85 C190,115 170,115 110,85", fill:"none", stroke:"var(--border)", "stroke-width":2, "marker-end":"url(#arrow)"}));
    svg.appendChild(textEl(180,85,"0.05","var(--fg-dim)",10));
    svg.appendChild(textEl(180,118,"0.05","var(--fg-dim)",10));
    const defs = el("defs",{});
    const marker = el("marker",{id:"arrow",markerWidth:8,markerHeight:8,refX:6,refY:3,orient:"auto"});
    marker.appendChild(el("path",{d:"M0,0 L6,3 L0,6 Z",fill:"var(--fg-dim)"}));
    defs.appendChild(marker); svg.appendChild(defs);
    svg.appendChild(el("circle",{id:"nodeN",cx:80,cy:70,r:28,fill:"var(--panel-solid)",stroke:"var(--accent)","stroke-width":2}));
    svg.appendChild(textEl(80,66,"N","var(--fg)",15,true));
    svg.appendChild(textEl(80,80,"no cargado","var(--fg-dim)",7));
    svg.appendChild(el("circle",{id:"nodeC",cx:280,cy:70,r:28,fill:"var(--panel-solid)",stroke:"var(--accent2)","stroke-width":2}));
    svg.appendChild(textEl(280,66,"C","var(--fg)",15,true));
    svg.appendChild(textEl(280,80,"cargado","var(--fg-dim)",7));
    svg.appendChild(textEl(80,150,"P(6)=1/6","var(--fg-dim)",9));
    svg.appendChild(textEl(280,150,"P(6)=1/2","var(--accent2)",9,true));
    svg.appendChild(textEl(180,175,"probabilidades de emisión","var(--fg-dim)",8));
  }
  function textEl(x,y,t,fill,size,bold){
    const e = el("text",{x,y,fill,"font-size":size,"text-anchor":"middle","font-family":"var(--font-mono)"});
    if(bold) e.setAttribute("font-weight","700");
    e.textContent=t; return e;
  }
  drawBase();

  function renderTimeline(){
    const tl = document.getElementById("hmmTl");
    tl.innerHTML = data.obs_seq.map((o,k)=>{
      const cls = k+1<step?"past":(k+1===step?"now":"");
      return `<div class="tl-step ${cls}">t=${k+1}<span class="sym">${k+1<=step? o : "?"}</span></div>`;
    }).join("");
  }

  function renderFrame(){
    renderTimeline();
    const nodeN = document.getElementById("nodeN");
    const nodeC = document.getElementById("nodeC");
    nodeN.setAttribute("stroke-width",2); nodeC.setAttribute("stroke-width",2);
    nodeN.setAttribute("fill","var(--panel-solid)"); nodeC.setAttribute("fill","var(--panel-solid)");
    const rd = document.getElementById("hmmReadout");
    if(step===0){
      rd.innerHTML = "Presioná ▶ para tirar el primer dado.";
    } else {
      const s = data.states_seq[step-1];
      const o = data.obs_seq[step-1];
      if(s==="N"){ nodeN.setAttribute("fill","var(--accent)"); nodeN.setAttribute("stroke-width",4); }
      else { nodeC.setAttribute("fill","var(--accent2)"); nodeC.setAttribute("stroke-width",4); }
      const hiddenTxt = reveal? `Estado oculto activo: <b>${s}</b> (${s==="N"?"dado no cargado":"dado cargado"}).` : `Estado oculto: <b>oculto</b> — tildá "Revelar" para verlo.`;
      rd.innerHTML = `t=${step}: salió <b>${o}</b>. ${hiddenTxt} P(seguir en ${s}) = ${trans[s][s]}, P(cambiar) = ${(1-trans[s][s]).toFixed(2)}.`;
    }
    document.getElementById("hmmStart").disabled = step===0;
    document.getElementById("hmmPrev").disabled = step===0;
    document.getElementById("hmmNext").disabled = step>=N_STEPS;
    document.getElementById("hmmEnd").disabled = step>=N_STEPS;
  }

  document.getElementById("hmmReveal").addEventListener("change", (e)=>{ reveal=e.target.checked; renderFrame(); });
  document.getElementById("hmmStart").addEventListener("click", ()=>{ step=0; renderFrame(); });
  document.getElementById("hmmPrev").addEventListener("click", ()=>{ step=Math.max(0,step-1); renderFrame(); });
  document.getElementById("hmmNext").addEventListener("click", ()=>{ step=Math.min(N_STEPS,step+1); renderFrame(); });
  document.getElementById("hmmEnd").addEventListener("click", ()=>{ step=N_STEPS; renderFrame(); });

  renderFrame();
}

/* ---------------- Viterbi trellis ---------------- */
function mountViterbiAnim(host){
  const states=["A","B"];
  const obs=["x","y","y"];
  const start={A:0.7,B:0.3};
  const trans={A:{A:0.1,B:0.9}, B:{A:0.8,B:0.2}};
  const emitP={A:{x:0.4,y:0.6}, B:{x:0.65,y:0.35}};

  const T = obs.length;
  const V = [];
  const BP = [];
  V.push({A:start.A*emitP.A[obs[0]], B:start.B*emitP.B[obs[0]]});
  BP.push({A:null,B:null});
  for(let t=1;t<T;t++){
    const row={}, bp={};
    states.forEach(s=>{
      let best=-1, bestFrom=null;
      states.forEach(prev=>{
        const val = V[t-1][prev]*trans[prev][s];
        if(val>best){ best=val; bestFrom=prev; }
      });
      row[s]=best*emitP[s][obs[t]];
      bp[s]=bestFrom;
    });
    V.push(row); BP.push(bp);
  }
  let finalState = V[T-1].A>=V[T-1].B? "A":"B";
  const path=[finalState];
  for(let t=T-1;t>0;t--){ finalState=BP[t][finalState]; path.unshift(finalState); }

  const totalSteps = T+1;
  let step=0;

  host.innerHTML = `
    <div class="timeline" id="vtTl"></div>
    <svg class="diagram" id="vtSvg" viewBox="0 0 360 190" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="readout" id="vtReadout"></div>
    <div class="anim-foot">
      <span style="font-size:10.5px;color:var(--fg-dim);font-family:var(--font-mono)">p=[0.7,0.3] · T(A→A)=.1 T(A→B)=.9 T(B→A)=.8 T(B→B)=.2 · E(x|A)=.4 E(y|A)=.6 E(x|B)=.65 E(y|B)=.35</span>
      <div class="ctrl-row" style="margin:0">
        <button id="vtStart">|&#9664;</button>
        <button id="vtPrev">&#9664;</button>
        <button id="vtNext">&#9654;</button>
        <button id="vtEnd">&#9654;|</button>
      </div>
    </div>
  `;

  const svgNS="http://www.w3.org/2000/svg";
  function el(tag,attrs){ const e=document.createElementNS(svgNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
  function textEl(x,y,t,fill,size,bold,anchor){
    const e=el("text",{x,y,fill,"font-size":size,"text-anchor":anchor||"middle","font-family":"var(--font-mono)"});
    if(bold) e.setAttribute("font-weight","700"); e.textContent=t; return e;
  }

  const colX = [40,150,255,340];
  const rowY = {A:50, B:130};

  function draw(){
    const svg = document.getElementById("vtSvg");
    svg.innerHTML="";
    const defs=el("defs",{});
    const marker=el("marker",{id:"vtArrow",markerWidth:7,markerHeight:7,refX:5,refY:2.5,orient:"auto"});
    marker.appendChild(el("path",{d:"M0,0 L5,2.5 L0,5 Z",fill:"var(--fg-dim)"}));
    defs.appendChild(marker); svg.appendChild(defs);

    svg.appendChild(el("circle",{cx:colX[0],cy:90,r:14,fill:"var(--panel-solid)",stroke:"var(--border)","stroke-width":2}));
    svg.appendChild(textEl(colX[0],94,"i","var(--fg-dim)",10));

    if(step>=1){
      svg.appendChild(el("line",{x1:colX[0]+12,y1:85,x2:colX[1]-16,y2:rowY.A, stroke: path[0]==="A"&&step>=4?"var(--accent)":"var(--border)", "stroke-width": path[0]==="A"&&step>=4?3:1.5, "marker-end":"url(#vtArrow)"}));
      svg.appendChild(el("line",{x1:colX[0]+12,y1:95,x2:colX[1]-16,y2:rowY.B, stroke: path[0]==="B"&&step>=4?"var(--accent)":"var(--border)", "stroke-width": path[0]==="B"&&step>=4?3:1.5, "marker-end":"url(#vtArrow)"}));
    }
    for(let t=1;t<T;t++){
      if(step>=t+1){
        states.forEach(to=>{
          states.forEach(from=>{
            const onPath = path[t]===to && path[t-1]===from && isPathEdge(t,from,to);
            const highlight = step>=4 && onPath;
            svg.appendChild(el("line",{
              x1:colX[t]+16, y1:rowY[from], x2:colX[t+1]-16, y2:rowY[to],
              stroke: highlight?"var(--accent)":"var(--border)",
              "stroke-width": highlight?3:1,
              "stroke-dasharray": (!highlight && step>=4)?"3,3":"none",
              "marker-end":"url(#vtArrow)"
            }));
          });
        });
      }
    }
    function isPathEdge(t,from,to){ return BP[t][to]===from && path[t]===to; }

    for(let t=0;t<T;t++){
      states.forEach(s=>{
        const shown = step>=t+1;
        const onFinalPath = step>=4 && path[t]===s;
        const c = el("circle",{cx:colX[t+1],cy:rowY[s],r:20,fill: shown?(onFinalPath?"var(--accent)":"var(--panel-solid)"):"var(--panel-raised)", stroke: onFinalPath?"var(--accent)":"var(--border)","stroke-width":onFinalPath?3:1.5});
        svg.appendChild(c);
        svg.appendChild(textEl(colX[t+1],rowY[s]-24,s,"var(--fg-dim)",10,true));
        if(shown){
          svg.appendChild(textEl(colX[t+1],rowY[s]+4, V[t][s].toFixed(4), onFinalPath?"var(--accent-ink)":"var(--fg)", 9, true));
        }
      });
      svg.appendChild(textEl(colX[t+1], 170, "i="+(t+1)+"  ("+obs[t]+")", "var(--fg-dim)", 10));
    }
  }

  function renderTimeline(){
    const tl = document.getElementById("vtTl");
    const labels = ["modelo"].concat(obs.map((o,i)=>"i="+(i+1)));
    tl.innerHTML = labels.map((l,k)=>{
      const cls = k<step?"past":(k===step?"now":"");
      const sym = k===0? "M" : obs[k-1];
      return `<div class="tl-step ${cls}">${l}<span class="sym">${sym}</span></div>`;
    }).join("");
  }

  function renderReadout(){
    const rd = document.getElementById("vtReadout");
    if(step===0){
      rd.innerHTML = `Modelo listo. Estados: A, B · Observación O = x, y, y · p(A)=0.7, p(B)=0.3. Presioná ▶ para calcular v₁.`;
    } else if(step<=T){
      const t=step-1;
      let txt = `<b>Paso i=${step}</b> (símbolo "${obs[t]}"): `;
      if(t===0){
        txt += `v₁(A) = p(A)×e_A(x) = 0.7×0.4 = <b>${V[0].A.toFixed(4)}</b> &nbsp;|&nbsp; v₁(B) = p(B)×e_B(x) = 0.3×0.65 = <b>${V[0].B.toFixed(4)}</b>`;
      } else {
        states.forEach(s=>{
          const from = BP[t][s];
          txt += `v${step}(${s}) = e_${s}(${obs[t]})·max[…] → viene de <b>${from}</b>, valor = <b>${V[t][s].toFixed(4)}</b>. `;
        });
      }
      rd.innerHTML = txt;
    } else {
      rd.innerHTML = `<b>Backtrace:</b> máx(v₃(A)=${V[T-1].A.toFixed(4)}, v₃(B)=${V[T-1].B.toFixed(4)}) → arranca en <b>${path[T-1]}</b>. Siguiendo los punteros hacia atrás, el camino más probable es <b>${path.join(" → ")}</b>, con P ≈ ${Math.max(V[T-1].A,V[T-1].B).toFixed(4)}.`;
    }
    document.getElementById("vtStart").disabled = step===0;
    document.getElementById("vtPrev").disabled = step===0;
    document.getElementById("vtNext").disabled = step>=totalSteps;
    document.getElementById("vtEnd").disabled = step>=totalSteps;
  }

  function renderAll(){ renderTimeline(); draw(); renderReadout(); }

  document.getElementById("vtStart").addEventListener("click", ()=>{ step=0; renderAll(); });
  document.getElementById("vtPrev").addEventListener("click", ()=>{ step=Math.max(0,step-1); renderAll(); });
  document.getElementById("vtNext").addEventListener("click", ()=>{ step=Math.min(totalSteps,step+1); renderAll(); });
  document.getElementById("vtEnd").addEventListener("click", ()=>{ step=totalSteps; renderAll(); });

  renderAll();
}

  if(next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
