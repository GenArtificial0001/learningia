<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Quién Sabe HMM? — Unidad 3</title>
<meta name="description" content="Juego de preguntas y respuestas estilo programa de TV sobre Modelos Ocultos de Markov, con todo el contenido de la Unidad 3 de Bioinformática UNAJ.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --bg0:#02030f; --bg1:#060a2e; --bg2:#0b1250;
  --panel:rgba(10,14,46,.86); --panel-raised:#101a5c;
  --border:rgba(255,205,70,.35); --border-strong:rgba(255,205,70,.65);
  --fg:#eef3ff; --fg-muted:#9fb0e8; --fg-dim:#5c6bab;
  --gold:#ffd24d; --gold-deep:#f0a500; --gold-ink:#241700;
  --good:#39ffb4; --bad:#ff4d5e;
  --font-display:'Orbitron',system-ui,sans-serif;
  --font-body:'Rajdhani',Inter,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --glow-gold: 0 0 22px rgba(255,210,77,.45);
  --glow-good: 0 0 18px rgba(57,255,180,.45);
  --glow-bad: 0 0 18px rgba(255,77,94,.45);
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg0:#eef1ff; --bg1:#dde3fb; --bg2:#c9d2f7;
    --panel:rgba(255,255,255,.9); --panel-raised:#ffffff;
    --border:rgba(176,122,0,.35); --border-strong:rgba(176,122,0,.6);
    --fg:#101433; --fg-muted:#3c4584; --fg-dim:#6b74ad;
    --gold:#b07a00; --gold-deep:#8a5f00; --gold-ink:#fff8e4;
    --good:#0a9a66; --bad:#c4293a;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg0:#eef1ff; --bg1:#dde3fb; --bg2:#c9d2f7;
  --panel:rgba(255,255,255,.9); --panel-raised:#ffffff;
  --border:rgba(176,122,0,.35); --border-strong:rgba(176,122,0,.6);
  --fg:#101433; --fg-muted:#3c4584; --fg-dim:#6b74ad;
  --gold:#b07a00; --gold-deep:#8a5f00; --gold-ink:#fff8e4;
  --good:#0a9a66; --bad:#c4293a;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden}
body{
  margin:0; color:var(--fg); font-family:var(--font-body); font-size:16px; overflow-x:hidden;
  background:
    radial-gradient(ellipse 1200px 700px at 50% -10%, rgba(255,210,77,.12), transparent 60%),
    radial-gradient(ellipse 900px 600px at 50% 110%, rgba(80,110,255,.18), transparent 60%),
    linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg2));
  min-height:100dvh;
  font-variant-numeric: tabular-nums;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:.3px}
.mono{font-family:var(--font-mono)}
button{font-family:inherit}
::selection{background:var(--gold);color:var(--gold-ink)}

.wrap{max-width:1100px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand .mark{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;color:var(--gold);box-shadow:var(--glow-gold);font-size:13px}
.topbar h1{font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg)}
.topbar .sub{font-size:10.5px;color:var(--fg-dim);letter-spacing:.3px}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--panel-raised);color:var(--fg-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{color:var(--gold);border-color:var(--gold)}
.top-actions{display:flex;gap:8px;align-items:center}
a.back-link{font-size:11px;color:var(--fg-muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:var(--font-mono)}
a.back-link:hover{color:var(--gold);border-color:var(--gold)}

.panel{position:relative;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:22px}

/* ---- start screen ---- */
.start{text-align:center;padding:30px 18px 10px}
.start h2{font-size:clamp(26px,5vw,42px);letter-spacing:1px;background:linear-gradient(180deg,#fff4d0,var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:var(--glow-gold);margin-bottom:6px}
.start .tagline{color:var(--fg-muted);font-size:14px;max-width:46ch;margin:0 auto 20px}
.start .record{display:inline-flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:10px 18px;margin-bottom:24px;font-family:var(--font-mono);font-size:12.5px;color:var(--fg-muted)}
.start .record b{color:var(--gold);font-size:15px}
.play-btn{font-family:var(--font-display);font-size:18px;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(180deg,#ffe49a,var(--gold) 55%,var(--gold-deep));color:var(--gold-ink);border:none;border-radius:40px;padding:16px 46px;cursor:pointer;box-shadow:var(--glow-gold);font-weight:800}
.play-btn:hover{filter:brightness(1.08)}
.start .rules{max-width:640px;margin:30px auto 0;text-align:left;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.start .rules div{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel-raised)}
.start .rules div b{display:block;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-family:var(--font-display)}
.start .rules div span{font-size:12.5px;color:var(--fg-muted);line-height:1.5}
.mute-row{display:flex;justify-content:center;gap:8px;margin-top:22px;align-items:center;font-size:11.5px;color:var(--fg-dim)}

/* ---- game layout ---- */
.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px}
@media (max-width:820px){.game-grid{grid-template-columns:minmax(0,1fr)}}

.q-card{padding:24px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.q-level-tag{font-family:var(--font-display);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:4px 10px}
.q-tema-tag{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-dim);border:1px solid var(--border);border-radius:6px;padding:4px 10px}
.timer-wrap{flex:1;min-width:120px;height:8px;border-radius:5px;background:var(--panel-raised);border:1px solid var(--border);overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--good),var(--gold));width:100%;transition:width 1s linear}
.timer-bar.low{background:linear-gradient(90deg,var(--bad),var(--gold))}

.q-text{font-size:clamp(17px,2.4vw,21px);font-weight:700;line-height:1.45;margin:10px 0 20px;font-family:var(--font-body);overflow-wrap:break-word}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:620px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--border);background:var(--panel-raised);color:var(--fg);padding:13px 14px;border-radius:10px;cursor:pointer;font-size:14.5px;line-height:1.35;transition:border-color .12s,box-shadow .12s;min-width:0}
.opt .letter{font-family:var(--font-display);font-size:12.5px;color:var(--gold);border:1.5px solid var(--gold);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.opt > span:last-child{flex:1;min-width:0;overflow-wrap:break-word}
.opt:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 10px rgba(255,210,77,.3)}
.opt.selected{border-color:var(--gold);box-shadow:var(--glow-gold);background:color-mix(in srgb, var(--gold) 12%, var(--panel-raised))}
.opt.correct{border-color:var(--good);box-shadow:var(--glow-good);background:color-mix(in srgb, var(--good) 16%, var(--panel-raised))}
.opt.wrong{border-color:var(--bad);box-shadow:var(--glow-bad);background:color-mix(in srgb, var(--bad) 16%, var(--panel-raised))}
.opt.faded{opacity:.3;pointer-events:none}
.opt:disabled{cursor:default}

.lifelines{display:flex;gap:10px;margin:18px 0 6px}
.life-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--border);background:var(--panel-raised);color:var(--fg-muted);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;font-family:var(--font-mono);font-size:9px;gap:1px}
.life-btn b{font-size:12px;color:var(--fg)}
.life-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.life-btn:disabled{opacity:.25;cursor:not-allowed}

.action-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:10px}
.walk-btn{font-family:var(--font-mono);font-size:12px;color:var(--fg-dim);background:none;border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer}
.walk-btn:hover{color:var(--bad);border-color:var(--bad)}
.confirm-btn{font-family:var(--font-display);font-size:13px;letter-spacing:.6px;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border:none;border-radius:8px;padding:11px 22px;cursor:pointer;font-weight:700}
.confirm-btn:disabled{opacity:.3;cursor:not-allowed}

.audience-chart{display:flex;align-items:flex-end;gap:14px;margin:14px 0 4px;padding:0 6px}
.audience-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.audience-chart .bar-track{width:100%;height:70px;display:flex;align-items:flex-end}
.audience-chart .bar{width:100%;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border-radius:4px 4px 0 0;min-height:3px}
.audience-chart .pct{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted)}

.hint-box{margin-top:14px;background:var(--panel-raised);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--fg-muted);line-height:1.5}
.hint-box b{color:var(--gold);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-family:var(--font-display)}

/* ---- ladder ---- */
.ladder{padding:14px 10px;display:flex;flex-direction:column-reverse;gap:3px}
.ladder .rung{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:6px;font-family:var(--font-mono);font-size:12px;color:var(--fg-dim)}
.ladder .rung .n{opacity:.7}
.ladder .rung.safe{color:var(--fg-muted);font-weight:700}
.ladder .rung.safe::after{content:"★";color:var(--gold);margin-left:4px;font-size:9px}
.ladder .rung.current{background:var(--gold);color:var(--gold-ink);box-shadow:var(--glow-gold);font-weight:800;transform:scale(1.04)}
.ladder .rung.done{color:var(--good)}
@media (max-width:820px){
  .ladder{flex-direction:row;overflow-x:auto;padding:10px 4px}
  .ladder .rung{flex:none;min-width:72px;flex-direction:column;gap:2px;text-align:center}
}

/* ---- confirm / modal ---- */
.confirm-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;padding:14px;border:1px dashed var(--gold);border-radius:10px;background:rgba(255,210,77,.06)}
.confirm-bar span{font-family:var(--font-display);font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
.confirm-bar button{font-family:var(--font-display);font-size:12px;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;padding:9px 18px;cursor:pointer;border:1px solid var(--border)}
.confirm-bar .yes{background:var(--gold);color:var(--gold-ink);border:none;font-weight:700}
.confirm-bar .no{background:transparent;color:var(--fg-muted)}

.modal-backdrop{position:fixed;inset:0;background:rgba(2,3,15,.78);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-backdrop.show{opacity:1;pointer-events:auto}
.modal-card{max-width:480px;width:100%;max-height:86vh;overflow-y:auto;background:var(--panel-raised);border:1px solid var(--border-strong);border-radius:16px;padding:28px 26px;text-align:center;transform:scale(.94);transition:transform .25s;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-backdrop.show .modal-card{transform:scale(1)}
.modal-card h3{font-size:22px;margin-bottom:6px}
.modal-card.win h3{background:linear-gradient(180deg,#fff4d0,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.modal-card .amount{font-family:var(--font-display);font-size:38px;color:var(--gold);margin:10px 0;text-shadow:var(--glow-gold)}
.modal-card p{color:var(--fg-muted);font-size:13.5px;line-height:1.6}
.modal-card .qsnap{text-align:left;background:var(--panel);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12.5px}
.modal-card .qsnap .correct-line{color:var(--good);font-weight:700;margin-bottom:4px}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

@media (max-width:480px){
  .q-card{padding:16px}
  .panel{padding:16px}
  .opts{gap:8px}
  .lifelines{gap:8px}
  .life-btn{width:46px;height:46px}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="mark">HMM</div>
      <div>
        <h1>¿Quién Sabe HMM?</h1>
        <div class="sub">Unidad 3 · Bioinformática UNAJ</div>
      </div>
    </div>
    <div class="top-actions">
      <a class="back-link" href="laboratorio-hmm.html">← Laboratorio</a>
      <button class="iconbtn" id="themeBtn" title="Cambiar tema">◐</button>
      <button class="iconbtn" id="muteBtn" title="Silenciar">🔊</button>
    </div>
  </div>

  <div id="app"></div>
</div>

<div class="modal-backdrop" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script src="topics-data.js"></script>
<script>
(function(){
"use strict";

/* ================= datos / pool por dificultad ================= */
const TIER_OF_TEMA = {iamldl:1, probmodels:1, hmm:2, forward:2, repaso10:3, dnahmm:3, tasks:3, viterbi:4, learning:5};
const LEVEL_TIER = [1,1,1,2,2,2,3,3,3,4,4,4,5,5,5]; // index 0..14 -> nivel 1..15

function buildPool(){
  const pool = {1:[],2:[],3:[],4:[],5:[]};
  TOPICS.forEach(t=>{
    const tier = TIER_OF_TEMA[t.id] || 3;
    t.subtemas.forEach(s=> pool[tier].push({q:s.q.q, o:s.q.o.slice(), c:s.q.c, e:s.q.e, tema:t.short, hint:s.explain}));
    t.questions.forEach(q=> pool[tier].push({q:q.q, o:q.o.slice(), c:q.c, e:q.e, tema:t.short, hint:t.concept}));
  });
  return pool;
}
const POOL = buildPool();

const LADDER = [100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const SAFE_LEVELS = [5,10]; // 1-indexado: nivel 5 y nivel 10 son "piso seguro"
function fmt(n){ return n.toLocaleString("es-AR"); }
function safeAmount(level){
  // devuelve el monto asegurado SI justo perdes en "level" (1-indexado, nivel que se esta por responder)
  let amt = 0;
  SAFE_LEVELS.forEach(sl=>{ if(level > sl) amt = LADDER[sl-1]; });
  return amt;
}

/* ================= audio sintetizado (sin archivos externos) ================= */
let actx = null, muted = false;
function ctx(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==="suspended") actx.resume(); return actx; }
function tone(freq, t0, dur, type, gain){
  if(muted) return;
  const c = ctx();
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type||"sine"; osc.frequency.setValueAtTime(freq, c.currentTime+t0);
  g.gain.setValueAtTime(0, c.currentTime+t0);
  g.gain.linearRampToValueAtTime(gain||0.12, c.currentTime+t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(c.currentTime+t0); osc.stop(c.currentTime+t0+dur+0.05);
}
function sfxClick(){ tone(520,0,.08,"square",.05); }
function sfxTick(){ tone(880,0,.045,"square",.045); }
function sfxCorrect(){ tone(523,0,.14,"sine",.11); tone(659,.12,.14,"sine",.11); tone(784,.24,.22,"sine",.13); }
function sfxWrong(){ tone(180,0,.3,"sawtooth",.1); tone(140,.08,.4,"sawtooth",.09); }
function sfxMilestone(){ [523,659,784,1047].forEach((f,i)=> tone(f,i*.11,.18,"sine",.12)); }
function sfxLifeline(){ const c=ctx(); const osc=c.createOscillator(), g=c.createGain(); osc.type="sine";
  osc.frequency.setValueAtTime(260,c.currentTime); osc.frequency.exponentialRampToValueAtTime(900,c.currentTime+.25);
  g.gain.setValueAtTime(0.1,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+.28);
  osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime+.3); }
function sfxWin(){ [523,587,659,698,784,880,1047].forEach((f,i)=> tone(f,i*.13,.3,"sine",.14)); }
function sfxWalk(){ tone(440,0,.18,"sine",.1); tone(330,.15,.25,"sine",.09); }

/* ================= estado / progreso ================= */
const REC_KEY = "hmm_millonario_best_v1";
function loadBest(){ try{ return JSON.parse(localStorage.getItem(REC_KEY)) || {level:0, points:0}; }catch(e){ return {level:0, points:0}; } }
function saveBest(level, points){
  const b = loadBest();
  if(points > b.points){ localStorage.setItem(REC_KEY, JSON.stringify({level, points, date:new Date().toISOString().slice(0,10)})); }
}

let S = null; // estado de partida en curso
function newGame(){
  S = {
    level: 1, banked: 0,
    usedFifty:false, usedAudience:false, usedHint:false,
    hiddenIdx: null, audiencePct: null,
    usedQ: {1:new Set(),2:new Set(),3:new Set(),4:new Set(),5:new Set()},
    current: null, order: null, picked: null, locked: false, confirming:false,
    timeLeft: 30, timerId: null,
  };
}

function pickQuestion(level){
  const tier = LEVEL_TIER[level-1];
  const bag = POOL[tier];
  const used = S.usedQ[tier];
  let idx; let guard = 0;
  do{ idx = Math.floor(Math.random()*bag.length); guard++; } while(used.has(idx) && used.size < bag.length && guard < 200);
  used.add(idx);
  const raw = bag[idx];
  // barajar opciones, re-mapeando el indice correcto
  const order = raw.o.map((opt,i)=> ({opt,i})).sort(()=> Math.random()-0.5);
  const correctPos = order.findIndex(x=> x.i===raw.c);
  return { q: raw.q, options: order.map(x=>x.opt), correct: correctPos, explain: raw.e, tema: raw.tema, hint: raw.hint };
}

/* ================= render ================= */
const app = document.getElementById("app");

function renderStart(){
  const best = loadBest();
  app.innerHTML = `
    <div class="panel start">
      <h2>¿Quién Sabe HMM?</h2>
      <p class="tagline">15 preguntas, dificultad creciente, con todo el contenido de Modelos Ocultos de Markov de la Unidad 3. Sin vuelta atrás una vez confirmada la respuesta — como en la tele.</p>
      ${best.points>0? `<div class="record">Tu mejor resultado: <b>Nivel ${best.level} · $${fmt(best.points)}</b></div>`:""}
      <div><button class="play-btn" id="playBtn">▶ Jugar</button></div>
      <div class="rules">
        <div><b>15 preguntas</b><span>De temas básicos (IA/ML/DL) hasta los más difíciles (Aprendizaje, Baum-Welch).</span></div>
        <div><b>3 comodines</b><span>50:50, Ayuda del público y Pista del profesor — una sola vez cada uno.</span></div>
        <div><b>Pisos seguros</b><span>Niveles 5 y 10 aseguran esos puntos aunque falles después.</span></div>
        <div><b>Retirarte</b><span>Podés plantarte en cualquier momento y guardar lo ganado.</span></div>
      </div>
      <div class="mute-row">Sonido sintetizado — nada de audio con copyright. Usá el ícono 🔊 arriba para silenciar.</div>
    </div>
  `;
  document.getElementById("playBtn").addEventListener("click", ()=>{ ctx(); sfxClick(); newGame(); nextQuestion(); });
}

function ladderHTML(){
  let html = '<div class="panel"><div class="ladder">';
  for(let i=15;i>=1;i--){
    const cls = i===S.level? "current" : (i<S.level? "done" : "");
    const safe = SAFE_LEVELS.includes(i)? "safe":"";
    html += `<div class="rung ${cls} ${safe}"><span class="n">${i}</span><span>$${fmt(LADDER[i-1])}</span></div>`;
  }
  html += '</div></div>';
  return html;
}

function nextQuestion(){
  clearInterval(S.timerId);
  S.current = pickQuestion(S.level);
  S.order = null; S.picked = null; S.locked = false; S.confirming = false;
  S.hiddenIdx = null; S.audiencePct = null;
  S.timeLeft = 30;
  renderGame();
  startTimer();
}

function startTimer(){
  const bar = document.getElementById("timerBar");
  S.timerId = setInterval(()=>{
    S.timeLeft--;
    if(bar){
      bar.style.width = (S.timeLeft/30*100)+"%";
      bar.classList.toggle("low", S.timeLeft<=10);
    }
    if(S.timeLeft<=10 && S.timeLeft>0) sfxTick();
    if(S.timeLeft<=0){
      clearInterval(S.timerId);
      if(!S.locked) timeUp();
    }
  },1000);
}

function timeUp(){
  S.locked = true;
  revealAnswer(false, true);
}

function renderGame(){
  const q = S.current;
  app.innerHTML = `
    <div class="game-grid">
      <div class="panel q-card">
        <div class="q-meta">
          <span class="q-level-tag">Nivel ${S.level} · $${fmt(LADDER[S.level-1])}</span>
          <span class="q-tema-tag">${q.tema}</span>
          <div class="timer-wrap"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
        </div>
        <div class="q-text">${q.q}</div>
        <div class="opts" id="opts">
          ${q.options.map((opt,i)=> `<button class="opt" data-i="${i}" ${S.hiddenIdx && S.hiddenIdx.includes(i)?'style="visibility:hidden"':''}><span class="letter">${"ABCD"[i]}</span><span>${opt}</span></button>`).join("")}
        </div>
        ${S.audiencePct? audienceHTML() : ""}
        <div id="hintSlot"></div>
        <div id="confirmSlot"></div>
        <div class="lifelines">
          <button class="life-btn" id="lfFifty" ${S.usedFifty?'disabled':''}>50:50</button>
          <button class="life-btn" id="lfAudience" ${S.usedAudience?'disabled':''}><b>👥</b>Público</button>
          <button class="life-btn" id="lfHint" ${S.usedHint?'disabled':''}><b>💡</b>Pista</button>
        </div>
        <div class="action-row">
          <button class="walk-btn" id="walkBtn">🚪 Retirarme con $${fmt(S.banked)}</button>
        </div>
      </div>
      ${ladderHTML()}
    </div>
  `;
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(S.locked) return;
      sfxClick();
      S.picked = +btn.dataset.i;
      document.querySelectorAll(".opt").forEach(b=> b.classList.remove("selected"));
      btn.classList.add("selected");
      showConfirm();
    });
  });
  document.getElementById("walkBtn").addEventListener("click", walkAway);
  document.getElementById("lfFifty").addEventListener("click", useFifty);
  document.getElementById("lfAudience").addEventListener("click", useAudience);
  document.getElementById("lfHint").addEventListener("click", useHint);
}

function audienceHTML(){
  const hidden = S.hiddenIdx || [];
  return `<div class="audience-chart">${S.audiencePct.map((p,i)=>{
    if(hidden.includes(i)) return "";
    return `<div class="bar-col"><span class="pct">${p}%</span><div class="bar-track"><div class="bar" style="height:${Math.max(4,p)}%"></div></div><span class="pct mono">${"ABCD"[i]}</span></div>`;
  }).join("")}</div>`;
}

function showConfirm(){
  const slot = document.getElementById("confirmSlot");
  slot.innerHTML = `<div class="confirm-bar"><span>¿Es tu respuesta final?</span><button class="no" id="cNo">Esperá</button><button class="yes" id="cYes">Sí, confirmar</button></div>`;
  document.getElementById("cNo").addEventListener("click", ()=>{ slot.innerHTML=""; });
  document.getElementById("cYes").addEventListener("click", ()=>{
    S.locked = true; clearInterval(S.timerId);
    revealAnswer(S.picked===S.current.correct, false);
  });
}

function useFifty(){
  if(S.usedFifty||S.locked) return;
  S.usedFifty = true; sfxLifeline();
  const q = S.current;
  const wrongIdx = q.options.map((_,i)=>i).filter(i=> i!==q.correct);
  const toHide = wrongIdx.sort(()=>Math.random()-0.5).slice(0,2);
  S.hiddenIdx = toHide;
  renderGame();
}
function useAudience(){
  if(S.usedAudience||S.locked) return;
  S.usedAudience = true; sfxLifeline();
  const q = S.current;
  const hidden = S.hiddenIdx || [];
  const visible = q.options.map((_,i)=>i).filter(i=> !hidden.includes(i));
  let pcts = new Array(q.options.length).fill(0);
  let correctShare = 55 + Math.random()*30;
  pcts[q.correct] = Math.round(correctShare);
  let rest = 100 - pcts[q.correct];
  const others = visible.filter(i=> i!==q.correct);
  others.forEach((idx,k)=>{
    const share = k===others.length-1? rest : Math.round(Math.random()*rest*0.6);
    pcts[idx] = share; rest -= share;
  });
  S.audiencePct = pcts;
  renderGame();
}
function useHint(){
  if(S.usedHint||S.locked) return;
  S.usedHint = true; sfxLifeline();
  const slot = document.getElementById("hintSlot");
  slot.innerHTML = `<div class="hint-box"><b>Pista del profesor</b>${S.current.hint}</div>`;
}

function revealAnswer(correct, timedOut){
  const q = S.current;
  document.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled = true;
    if(i===q.correct) b.classList.add("correct");
    else if(i===S.picked && !correct) b.classList.add("wrong");
  });
  document.getElementById("confirmSlot").innerHTML = "";
  if(correct){
    sfxCorrect();
    if(SAFE_LEVELS.includes(S.level)) setTimeout(sfxMilestone, 300);
    S.banked = LADDER[S.level-1];
    setTimeout(()=>{
      if(S.level>=15){ winGame(); }
      else { S.level++; nextQuestion(); }
    }, 1900);
  } else {
    sfxWrong();
    const safe = safeAmount(S.level);
    setTimeout(()=> loseGame(safe, timedOut), 1600);
  }
}

function walkAway(){
  clearInterval(S.timerId);
  sfxWalk();
  openModal(`
    <h3>Te retiraste</h3>
    <div class="amount">$${fmt(S.banked)}</div>
    <p>Jugada inteligente: te vas con lo que ya ganaste en el nivel ${S.level-1<1?0:S.level-1}.</p>
    <div class="modal-actions">
      <button class="confirm-btn" id="mAgain">Jugar de nuevo</button>
    </div>
  `);
  saveBest(S.level-1, S.banked);
  document.getElementById("mAgain").addEventListener("click", ()=>{ closeModal(); renderStart(); });
}

function loseGame(safe, timedOut){
  const q = S.current;
  openModal(`
    <h3 style="color:var(--bad)">${timedOut? "¡Se acabó el tiempo!" : "Respuesta incorrecta"}</h3>
    <div class="amount">$${fmt(safe)}</div>
    <p>Te vas con el último piso seguro alcanzado.</p>
    <div class="qsnap">
      <div class="correct-line">Correcta: ${q.options[q.correct]}</div>
      <div>${q.explain}</div>
    </div>
    <div class="modal-actions">
      <button class="confirm-btn" id="mAgain">Jugar de nuevo</button>
    </div>
  `);
  saveBest(S.level-1, safe);
  document.getElementById("mAgain").addEventListener("click", ()=>{ closeModal(); renderStart(); });
}

function winGame(){
  sfxWin();
  openModal(`
    <h3>¡Llegaste al millón!</h3>
    <div class="amount">$${fmt(LADDER[14])}</div>
    <p>Respondiste las 15 preguntas de la Unidad 3 completa — de IA/ML/DL hasta Baum-Welch. Dominás el Laboratorio HMM.</p>
    <div class="modal-actions">
      <button class="confirm-btn" id="mAgain">Jugar de nuevo</button>
    </div>
  `, true);
  saveBest(15, LADDER[14]);
  document.getElementById("mAgain").addEventListener("click", ()=>{ closeModal(); renderStart(); });
}

function openModal(html, win){
  const back = document.getElementById("modal");
  const card = document.getElementById("modalCard");
  card.className = "modal-card" + (win? " win":"");
  card.innerHTML = html;
  back.classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }

/* ================= tema / mute ================= */
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  if(cur==="light"){ r.setAttribute("data-theme","dark"); }
  else if(cur==="dark"){ r.removeAttribute("data-theme"); }
  else { r.setAttribute("data-theme","light"); }
});
document.getElementById("muteBtn").addEventListener("click", (e)=>{
  muted = !muted; e.target.textContent = muted? "🔇" : "🔊";
});

renderStart();
})();
</script>
</body>
</html>
